name: Main

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v5
      - name: Install clang & make
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make
      - name: Build libfiowrapper.so, libfioinfo.so
        run: make release
      - name: Release
        uses: actions/upload-artifact@v4
        with:
          files: |
            libfiowrapper.so
            libfioinfo.so

